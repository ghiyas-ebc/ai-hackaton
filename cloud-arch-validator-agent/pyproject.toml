[project]
name = "cloud-arch-validator-agent"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name", email = "your@email.com"},
]

dependencies = [
    "google-adk[gcp]>=2.0.0,<3.0.0",
    "a2a-sdk[http-server]~=0.3.22",
    "aiohttp>=3.13.4",
    "opentelemetry-instrumentation-google-genai>=0.1.0,<1.0.0",
    "gcsfs>=2024.11.0",
    "google-cloud-logging>=3.12.0,<4.0.0",
    # The knowledge graph lives in Postgres, reached over a DSN. psycopg is a
    # plain driver, not a cloud client: the same code talks to the local
    # docker-compose database and to Cloud SQL, and nothing in the read or
    # write path needs credentials for a specific cloud.
    "psycopg[binary,pool]>=3.2,<4.0",
    # Still required. The YAML backend is no longer the source of truth, but it
    # is what the migration is tested against and what the loader falls back to
    # when no database is configured.
    "pyyaml>=6.0",
    # ASCII flowchart layout. Pulls networkx and pillow — neither is a cloud
    # client and neither needs credentials, so invariant #3 is intact, but the
    # cost is real and worth naming: pillow is a compiled extension imported
    # eagerly for a PNG export this project does not use.
    #
    # Adopted because the layout is Sugiyama rather than force-directed, which
    # makes it deterministic — verified across processes under a randomised
    # PYTHONHASHSEED. A renderer that draws the same architecture differently
    # on two runs is not usable in a document that goes to a client.
    "retroflow>=0.10,<1.0",
]
requires-python = ">=3.11,<3.14"


[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=2.0.0,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=1.156.0",
]
lint = [
    "ruff>=0.4.6,<1.0.0",
    "ty>=0.0.1a0",
    "codespell>=2.2.0,<3.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
# Vendored verbatim from the cloud-architecture-validator skills. Reformatting
# it here would fork the copy from the skills' own and make drift invisible in
# a diff, so it is linted (and styled) wherever it actually lives.
exclude = ["app/kg_lib/**", "app/evals/**"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "C",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP", # pyupgrade
    "RUF", # ruff specific rules
]
ignore = ["E501", "C901", "B006"] # ignore line too long, too complex

[tool.ruff.lint.per-file-ignores]
# The engine modules import each other by bare name, so app/kg_lib/ has to be on
# sys.path before any of them is imported. That makes the sys.path statement
# load-bearing and the imports below it necessarily non-top-of-file. The
# alternative isort would produce fails only at runtime.
"app/tools.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app", "frontend"]

[tool.ty]
# ty is Astral's Rust-based type checker (same team as ruff/uv)
# See: https://docs.astral.sh/ty/

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
exclude = [".venv/**"]

[tool.ty.rules]
# Ignore common issues with third-party libraries and dynamic code patterns
unresolved-import = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
possibly-missing-attribute = "ignore"
not-subscriptable = "ignore"
deprecated = "ignore"

[tool.codespell]
ignore-words-list = "rouge"
skip = "./locust_env/*,uv.lock,.venv,./frontend,**/package-lock.json"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "session"

[tool.hatch.build.targets.wheel]
packages = ["app","frontend"]


