# Icon metadata for diagram rendering.
#
# This file does NOT contain icon artwork. It maps each service_id to a file
# path inside locally installed official icon sets. The paths are resolved at
# runtime using CAV_GCP_ICON_DIR and CAV_AZURE_ICON_DIR environment variables.
#
# Constraint: do not copy official Google or Microsoft icon files into this
# repository. Brand guidelines prohibit re-bundling, and the icons change often.
# The skill ships with only this mapping; the emitter looks up local assets at
# runtime.

# Generic category icons are used when a service does not have a unique core
# icon. Each entry gives the path fragment to append to the provider icon root.
categories:
  gcp:
    ai-machine-learning:
      name: "AI / Machine Learning"
      file: "Category Icons/AI _ Machine Learning/SVG/AIMachineLearning-512-color.svg"
    compute:
      name: Compute
      file: "Category Icons/Compute/SVG/Compute-512-color.svg"
    containers:
      name: Containers
      file: "Category Icons/Containers/SVG/Containers-512-color.svg"
    data-analytics:
      name: "Data Analytics"
      file: "Category Icons/Data Analytics/SVG/DataAnalytics-512-color.svg"
    databases:
      name: Databases
      file: "Category Icons/Databases/SVG/Databases-512-color.svg"
    networking:
      name: Networking
      file: "Category Icons/Networking/SVG/Networking-512-color-rgb.svg"
    security-identity:
      name: "Security Identity"
      file: "Category Icons/Security Identity/SVG/SecurityIdentity-512-color.svg"
    serverless-computing:
      name: "Serverless Computing"
      file: "Category Icons/Serverless Computing/SVG/ServerlessComputing-512-color.svg"
    storage:
      name: Storage
      file: "Category Icons/Storage/SVG/Storage-512-color.svg"
  azure:
    generic:
      name: "Generic Azure"
      file: "general/Azure.svg"

# Per-service icon resolution.
# type: core   -> unique icon in the official icon set.
# type: category -> icon from categories above.
# type: generic -> no official icon; emitter should draw a generic shape with the service label.
services:
  cloud-run: { provider: gcp, type: core, icon: "Unique Icons/Cloud Run/SVG/CloudRun-512-color-rgb.svg" }
  cloud-functions: { provider: gcp, type: category, category: serverless-computing }
  gke-autopilot: { provider: gcp, type: core, icon: "Unique Icons/GKE/SVG/GKE-512-color.svg" }
  compute-engine: { provider: gcp, type: core, icon: "Unique Icons/Compute Engine/SVG/ComputeEngine-512-color-rgb.svg" }
  app-engine: { provider: gcp, type: category, category: serverless-computing }
  cloud-sql: { provider: gcp, type: core, icon: "Unique Icons/Cloud SQL/SVG/CloudSQL-512-color.svg" }
  spanner: { provider: gcp, type: core, icon: "Unique Icons/Cloud Spanner/SVG/CloudSpanner-512-color.svg" }
  firestore: { provider: gcp, type: category, category: databases }
  bigtable: { provider: gcp, type: category, category: databases }
  memorystore: { provider: gcp, type: category, category: databases }
  cloud-storage: { provider: gcp, type: core, icon: "Unique Icons/Cloud Storage/SVG/Cloud_Storage-512-color.svg" }
  vpc: { provider: gcp, type: category, category: networking }
  serverless-vpc-access: { provider: gcp, type: category, category: networking }
  cloud-sql-auth-proxy: { provider: gcp, type: category, category: databases }
  private-service-connect: { provider: gcp, type: category, category: networking }
  cloud-load-balancing: { provider: gcp, type: category, category: networking }
  cloud-armor: { provider: gcp, type: category, category: networking }
  pubsub: { provider: gcp, type: category, category: data-analytics }
  dataflow: { provider: gcp, type: category, category: data-analytics }
  bigquery: { provider: gcp, type: core, icon: "Unique Icons/BigQuery/SVG/BigQuery-512-color.svg" }
  vertex-ai: { provider: gcp, type: category, category: ai-machine-learning }
  secret-manager: { provider: gcp, type: category, category: security-identity }

  azure-container-apps: { provider: azure, type: core, icon: "other/02989-icon-service-Container-Apps-Environments.svg" }
  azure-functions: { provider: azure, type: core, icon: "compute/10029-icon-service-Function-Apps.svg" }
  aks: { provider: azure, type: core, icon: "containers/10023-icon-service-Kubernetes-Services.svg" }
  azure-vm: { provider: azure, type: core, icon: "compute/10021-icon-service-Virtual-Machine.svg" }
  azure-app-service: { provider: azure, type: core, icon: "web/10035-icon-service-App-Services.svg" }
  azure-sql-database: { provider: azure, type: core, icon: "databases/10130-icon-service-SQL-Database.svg" }
  azure-sql-hyperscale:
    provider: azure
    type: generic
    note: "No official icon for Hyperscale; use generic database shape with SQL Database label."
  azure-cosmos-db: { provider: azure, type: core, icon: "databases/10121-icon-service-Azure-Cosmos-DB.svg" }
  azure-cache-redis: { provider: azure, type: core, icon: "databases/10137-icon-service-Cache-Redis.svg" }
  azure-blob-storage: { provider: azure, type: core, icon: "general/10780-icon-service-Blob-Block.svg" }
  azure-vnet: { provider: azure, type: core, icon: "networking/10061-icon-service-Virtual-Networks.svg" }
  azure-vnet-integration:
    provider: azure
    type: generic
    note: "No official icon for VNet Integration; use connector/generic shape."
  azure-private-link: { provider: azure, type: core, icon: "networking/00427-icon-service-Private-Link.svg" }
  azure-load-balancer: { provider: azure, type: core, icon: "networking/10062-icon-service-Load-Balancers.svg" }
  azure-app-gateway: { provider: azure, type: core, icon: "networking/10076-icon-service-Application-Gateways.svg" }
  azure-front-door: { provider: azure, type: core, icon: "networking/10073-icon-service-Front-Door-and-CDN-Profiles.svg" }
  azure-service-bus: { provider: azure, type: core, icon: "integration/10836-icon-service-Azure-Service-Bus.svg" }
  azure-event-grid: { provider: azure, type: core, icon: "integration/10206-icon-service-Event-Grid-Topics.svg" }
  azure-data-factory: { provider: azure, type: core, icon: "integration/10126-icon-service-Data-Factories.svg" }
  azure-stream-analytics: { provider: azure, type: core, icon: "analytics/00042-icon-service-Stream-Analytics-Jobs.svg" }
  azure-synapse: { provider: azure, type: core, icon: "databases/00606-icon-service-Azure-Synapse-Analytics.svg" }
  azure-ml: { provider: azure, type: core, icon: "ai + machine learning/10166-icon-service-Machine-Learning.svg" }
  azure-key-vault: { provider: azure, type: core, icon: "security/10245-icon-service-Key-Vaults.svg" }
