# GENERATED FILE — do not edit.
#
# Written by db/export_to_yaml.py from the Postgres knowledge graph, which
# is the source of truth. An edit here is overwritten by the next export,
# and tests/unit/test_kg_export_drift.py fails before that anyway.
#
# To change the graph: use the curator agent, or SQL, then re-run the
# export. To rebuild a database from this file: db/seed_from_yaml.py.

# Layers 2-8 — architecture-level checks, not pairwise connection checks.
# Layer 1 answers "can A connect to B". Everything above it answers the question
# the client's architect actually asks in a design review: will this hold up, is
# it safe, is the cost predictable, and can we ever leave. This is what
# separates the skill from a diagram generator.
# Each rule is implemented as a function in scripts/validate.py under the same
# id. This file controls severity, wording, and parameters — so tuning does not
# require touching code.
# Context the user can supply (optional; decides which rules are active):
# environment: production | poc | dev
# data_residency: id | eu | us | none
# sla_tier: critical | standard | best_effort
# The layer ladder (L1..L8)
# Every rule declares which layer it belongs to. The ladder is a decision tree
# in validate.py, NOT a thinking framework for the model — the moment a verdict
# depends on the model walking these rungs, the skill is a chatbot with
# opinions and root invariant #1 is gone. The model reads the layered output
# and explains it; it never decides a layer's outcome.
# Ordering is not cosmetic. L1 is a GATE: an edge that cannot connect at all
# is excluded from L2-L8 for that edge, because "your unreachable database is
# also publicly exposed" is cascade noise that buries the one finding that
# matters. L2-L8 are independent of each other and all run — an architecture
# can be perfectly secure and completely unaffordable.
# A layer with no rules yet reports UNCOVERED rather than passing silently
# (root invariant #5). L7 is in that state deliberately: performance findings
# need node properties the KG does not carry (scaling model, sync vs async,
# throughput class), and inventing them from category alone would be guessing.

layers:
- id: L0
  title: Presentation
  description: Not part of the ladder proper. Diagram readability, which is a property of
    the deliverable rather than of the architecture.
- id: L1
  title: Connectivity
  gate: true
  description: Can A reach B at all, and what component is missing. Implemented in connectivity-rules.yaml,
    not here.
- id: L2
  title: Security and exposure
  description: Public exposure, authentication path, secrets, edge protection.
- id: L3
  title: Reliability
  description: Single points of failure, zone and region blast radius.
- id: L4
  title: Data and residency
  description: Durability, backup, and where data is legally allowed to live.
- id: L5
  title: Cost
  description: Egress, cross-region traffic, tier and capacity model mismatch.
- id: L6
  title: Operations
  description: Observability, and how much of the stack the client must run.
- id: L7
  title: Performance and scale
  status: uncovered
  description: Bottlenecks, synchronous coupling, throughput mismatch. NO RULES YET — requires
    node properties the KG does not have. Reports UNCOVERED, which is the honest answer, not
    a gap to paper over.
- id: L8
  title: Portability
  description: 'Whether this design can move to the other provider. Derived from equivalences.yaml.
    Directly relevant to the presales persona: a client asking "are we locked in?" gets a
    derived answer, not a reassurance.'
rules:
- id: SEC-001-PUBLIC-DATASTORE
  layer: L2
  enabled: true
  severity: ERROR
  title: Datastore reachable over a public path
  message: A datastore is reached over a public endpoint with no private connector in the
    path. This is the first thing a client's security reviewer looks for.
  remediation: Add a private connector (Private Service Connect / Private Link / VPC connector),
    or move the compute inside the private network.
- id: SEC-002-NO-SECRET-STORE
  layer: L2
  enabled: true
  severity: WARNING
  title: No credential store
  message: The architecture has compute reaching a datastore but no secret store, which implies
    credentials live in environment variables or inside the image — a question that is almost
    certain to come up in review.
  remediation: Add Secret Manager / Key Vault to the architecture.
- id: SEC-003-COMPUTE-EXPOSED
  layer: L2
  enabled: true
  severity: WARNING
  title: Compute exposed with no managed entry point
  message: Compute receives external traffic with no load balancer or gateway in front, so
    there is nowhere to attach a WAF, rate limiting, or centralized TLS termination.
  remediation: Put an L7 load balancer or gateway at the entry point.
- id: REL-001-SINGLE-ZONE
  layer: L3
  enabled: true
  severity: WARNING
  title: Zonal component with no redundancy
  message: A component is scoped to a single zone. If that zone has trouble, the whole service
    goes with it.
  remediation: Use a managed instance group / availability set across zones, or switch to
    a regional service.
  applies_when:
    environment:
    - production
- id: REL-002-SINGLE-REGION
  layer: L3
  enabled: true
  severity: INFO
  title: Entire architecture in one region
  message: There is no region-level resilience. State this explicitly in the proposal — far
    better presented as a deliberate decision than discovered by the client as an oversight.
  remediation: Agree RTO/RPO with the client before committing to an SLA.
  applies_when:
    sla_tier:
    - critical
    environment:
    - production
- id: REL-003-NO-DATA-DURABILITY
  layer: L4
  enabled: true
  severity: INFO
  title: No backup shown
  message: The diagram shows no backup or replica for the datastores. Managed services usually
    have automated backups, but a technical audience will ask if it isn't visible.
  remediation: Annotate the backup policy on the datastore nodes.
- id: COST-001-CROSS-REGION-TRAFFIC
  layer: L5
  enabled: true
  severity: INFO
  title: Possible cross-region traffic
  message: The architecture mixes regional and multi-region components. Traffic leaving a
    region is billable and adds latency — frequently missed in proposal-stage cost estimates.
  remediation: Align the regions, or include egress in the cost estimate.
- id: GOV-001-DATA-RESIDENCY
  layer: L4
  enabled: true
  severity: WARNING
  title: Multi-region datastore under a data residency obligation
  message: A datastore is multi-region while the client has a data residency obligation. For
    regulated sectors in Indonesia (financial services, or data subject to PP 71/2019), this
    can invalidate the whole design at compliance review.
  remediation: Configure a compliant single-region location, and verify that region is available
    before committing to the client.
  applies_when:
    data_residency:
    - id
    - eu
# L8 — derived entirely from equivalences.yaml, so it costs no new node
# properties and cannot drift from what translate.py would actually do. Both
# ship at INFO regardless of how alarming they sound: per D14, a rule whose
# severity was reasoned rather than measured renders as INFO until it has
# been checked against real client material.
- id: OPS-001-NO-OBSERVABILITY
  layer: L6
  enabled: true
  severity: INFO
  title: No observability component
  message: No logging or monitoring is shown. Reasonable for a PoC, but usually asked about
    in a production proposal.
  remediation: Add a monitoring note, or state that it is out of PoC scope.
# L8 — derived entirely from equivalences.yaml, so it costs no new node
# properties and cannot drift from what translate.py would actually do. Both
# ship at INFO regardless of how alarming they sound: per D14, a rule whose
# severity was reasoned rather than measured renders as INFO until it has
# been checked against real client material.
- id: PORT-001-NO-EQUIVALENT
  layer: L8
  enabled: true
  severity: INFO
  title: No equivalent at the other provider
  message: One or more services in this design have no recorded equivalent at the other provider.
    This is a genuine lock-in point, and it is far better raised by you in the proposal than
    by the client's architect six months later.
  remediation: State the lock-in explicitly, or substitute a service that has an equivalent
    if portability is a stated requirement. If the equivalent exists but simply is not in
    the KG yet, add it with cloud-architecture-validator-add — do not assume absence means
    lock-in.
- id: PORT-002-AMBIGUOUS-EQUIVALENT
  layer: L8
  enabled: true
  severity: INFO
  title: Translation is not one-to-one
  message: One or more services translate to several mutually exclusive options, or only partially.
    A migration estimate that assumes a clean one-to-one mapping will be wrong for these.
  remediation: Answer the selection question for each before quoting migration effort. Run
    translate.py to see the options and their caveats.
- id: VIZ-001-TOO-MANY-NODES
  layer: L0
  enabled: true
  severity: INFO
  title: Diagram too dense
  message: The node count exceeds the readability threshold for a non-technical audience.
    One unreadable diagram is worse than three clear ones.
  remediation: Split by subsystem or domain.
  threshold: 20
