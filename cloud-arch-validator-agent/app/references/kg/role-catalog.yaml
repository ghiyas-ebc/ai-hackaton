#
# To change the graph: use the curator agent, or SQL, then re-run the
# export. To rebuild a database from this file: db/seed_from_yaml.py.

# Role vocabulary, and which roles the engine actually reads.
#
# `kind` is the whole point of this file:
#
# load_bearing — something matches this role: a connectivity rule's `when`
# clause, a `needs_role`, one of validate.py's L2-L8 checks, verdict_card.py's
# tech-mismatch rules, or `regenerate_roles`. Getting one wrong, or leaving
# one off, changes verdicts.
# descriptive — carried for the reader. True, useful in a service entry, and
# read by nothing. `wide_column_db` on Bigtable is the shape of it.
#
# The split is measured rather than declared: it is what the rules and the
# engine reference today. A rule that starts matching a descriptive role
# promotes it here, and the curator insists on it from then on. Rules lead,
# the catalog follows — this file does not license a role, it records that
# something reads one.
#
# The set is closed at the storage layer: `service_role.role` is a foreign key
# onto this table. A misspelled role used to insert cleanly, match nothing, and
# leave a node reading as fully specified with the integrity check clean through
# it. That is D6's failure shape, and the fix is D26's: put the refusal where
# no caller can route around it.

