# The company's own delivered-project history. Hand-authored, unlike
# app/references/kg/*.yaml — this is never generated. See D27 in the parent
# repo's CLAUDE.md for why the kg/ set is generated and this deliberately
# is not: this data was never YAML-authored under the old pre-Postgres
# system, has no CAV_KG_BACKEND=local offline consumer, and isn't checked
# by verdict_grounding's rule-id list. It goes the other direction instead —
# authored here, loaded once by db/seed_past_projects.py.
#
# List order becomes each project's authored display order (its members,
# services, and connections lists too — position becomes `ord`).
#
# `services` must be ids that exist in the knowledge graph
# (app/references/kg/services.yaml) — project_service/project_connection
# carry a foreign key onto kg.service, so seeding refuses an id the graph
# doesn't recognise rather than silently drawing a box for a service that
# was never validated.
#
# `client_name` is nullable and a judgment call per entry: use an
# anonymised descriptor ("Regional Retail Chain, NDA") rather than a real
# name where confidentiality requires it. The schema does not enforce
# either way.

- id: sodagr-ebco
  name: "Sodagr"
  description: >
    Sodagr adalah aplikasi kehadiran karyawan berbasis pengenalan wajah,
    memastikan absensi akurat dan efisien. Dilengkapi fitur manajemen tugas
    dan kalender terintegrasi Google API, aplikasi ini membantu pengguna
    mengatur jadwal, mengingatkan aktivitas penting, dan meningkatkan
    produktivitas dengan antarmuka yang intuitif. Cloud Run hosts four
    logical services (front end, back end, AI orchestration, face
    recognition) — the graph has one cloud-run id, so all four collapse to
    one node here. Cloud SQL sits behind a serverless VPC connector on a
    private IP, and credentials are read from Secret Manager. Vertex AI
    stands in for the custom face-embedding model (online prediction);
    Vertex AI Vector Search backs face-embedding lookup; Gemini is the LLM
    used by the AI service.
  use_case: "Employee attendance and task management"
  started_at: 2024-01-01
  ended_at:
  client_name: "Koperasi Pegawai PT Bank Mandiri (Persero) Tbk"
  tags: [face-recognition, employee-attendance, task-management, cloud-run, vertex-ai]
  members:
    - {name: "Luqman", role_on_project: "Mobile Developer"}
    - {name: "Dzikri", role_on_project: "Backend Engineer"}
    - {name: "Guntur", role_on_project: "System Analyst"}
  services:
    - cloud-load-balancing
    - cloud-armor
    - cloud-run
    - serverless-vpc-access
    - cloud-sql
    - secret-manager
    - vertex-ai
    - vertex-ai-vector-search
    - gemini-api
  connections:
    - {source: cloud-load-balancing, target: cloud-run, note: "public ingress to the front-end service"}
    - {source: cloud-run, target: serverless-vpc-access, note: "private egress into the VPC"}
    - {source: serverless-vpc-access, target: cloud-sql, note: "private IP, no public endpoint; back-end, AI and face-recognition services all read/write Cloud SQL"}
    - {source: cloud-run, target: secret-manager, note: "DB and API credentials read from Secret Manager, not env vars"}
    - {source: cloud-run, target: gemini-api, note: "AI service calls the Gemini LLM"}
    - {source: serverless-vpc-access, target: vertex-ai-vector-search, note: "face-recognition service queries the face-embedding vector index over a private path"}
    - {source: cloud-run, target: vertex-ai, note: "face-recognition service calls the face-embedding online prediction model"}

