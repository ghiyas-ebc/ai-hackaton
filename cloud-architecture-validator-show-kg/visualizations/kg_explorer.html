<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Cloud Architecture Validator — Knowledge Graph Explorer</title>
<script src="lib/nvl.bundle.js"></script>
<style>
  :root { --bg:#f7f8fa; --panel:#ffffff; --border:#dde1e7; --text:#1a1a2e; --muted:#6b7280; --accent:#0077b6; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--text); }
  #app { display:flex; height:100vh; }
  #sidebar { width:290px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--border); padding:16px; overflow-y:auto; }
  #canvas-wrap { flex:1; position:relative; background: radial-gradient(circle at 50% 40%, #1c2129 0%, #0c0e12 100%); }
  #frame { width:100%; height:100%; }
  #detail { width:320px; flex-shrink:0; background:var(--panel); border-left:1px solid var(--border); padding:16px; overflow-y:auto; }
  h1 { font-size:15px; margin:0 0 4px; letter-spacing:.01em; }
  .sub { color:var(--muted); font-size:11px; margin-bottom:16px; }
  fieldset { border:1px solid var(--border); border-radius:8px; margin-bottom:14px; padding:10px; }
  legend { font-size:10px; color:var(--muted); padding:0 6px; text-transform:uppercase; letter-spacing:.06em; }
  label { display:flex; align-items:center; gap:6px; font-size:13px; margin:5px 0; cursor:pointer; }
  input[type=text] { width:100%; padding:7px 10px; background:#fff; border:1px solid var(--border); color:var(--text); border-radius:20px; font-size:13px; }
  .swatch { width:11px; height:11px; border-radius:50%; display:inline-block; box-shadow: 0 0 0 1px rgba(0,0,0,.08); }
  .stat { font-size:12px; color:var(--muted); margin-top:10px; }
  .prop { font-size:12px; margin:5px 0; line-height:1.4; }
  .prop b { color:var(--muted); font-weight:500; display:block; font-size:10px; text-transform:uppercase; letter-spacing:.04em; }
  .badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; margin:2px 4px 2px 0; background:#eef1f5; color:#3a4250; border:1px solid var(--border); }
  #detail h2 { font-size:15px; margin:0 0 2px; }
  #detail .idline { color:var(--muted); font-size:11px; margin-bottom:14px; }
  .verdict-pill { display:inline-block; padding:3px 10px; border-radius:12px; font-size:12px; font-weight:600; color:#fff; }
  .msg { color:#374151; margin-top:10px; font-size:13px; line-height:1.5; background:#f7f8fa; border-radius:8px; padding:10px; }
  .placeholder { color:var(--muted); font-size:13px; margin-top:60px; text-align:center; padding:0 20px; }
  .node-label { position:absolute; top:100%; left:50%; transform:translate(-50%,6px); color:#e8eaf0; font-size:12px; white-space:nowrap; pointer-events:none; text-shadow:0 1px 3px rgba(0,0,0,.8); }
  .edge-label { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:10px; white-space:nowrap; pointer-events:none; background:#0c0e12; padding:1px 5px; border-radius:3px; }
  #topbar { position:absolute; top:14px; left:14px; right:14px; display:flex; justify-content:space-between; pointer-events:none; }
  #zoombox { pointer-events:auto; background:#fff; border:1px solid var(--border); border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.06); display:flex; }
  #zoombox button { border:none; background:none; width:32px; height:32px; cursor:pointer; font-size:16px; color:var(--text); }
  #zoombox button:hover { background:#f2f4f7; }
  #retrieval-box input[type=text] { margin-bottom:8px; }
  .row { display:flex; gap:6px; align-items:center; }
  .row button { flex:1; padding:6px 8px; font-size:12px; border-radius:6px; border:1px solid var(--border); background:#fff; cursor:pointer; }
  .row button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .row button:hover { filter:brightness(.96); }
  .knob { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); margin:6px 0; }
  .knob input[type=range] { flex:1; }
  .knob output { color:var(--text); font-variant-numeric:tabular-nums; width:14px; text-align:right; }
  #hits { margin-top:8px; }
  .hit { display:flex; justify-content:space-between; gap:6px; font-size:12px; padding:4px 6px; border-radius:5px; cursor:pointer; }
  .hit:hover { background:#f2f4f7; }
  .hit .why { color:var(--muted); font-size:10px; }
  .hit .score { font-variant-numeric:tabular-nums; color:var(--accent); font-weight:600; }
  .hop-tag { display:inline-block; width:16px; color:var(--muted); font-size:10px; }
  #trace { margin-top:10px; font-family:ui-monospace,Menlo,monospace; font-size:10.5px; line-height:1.5; color:#4b5563; background:#f7f8fa; border-radius:6px; padding:8px; white-space:pre-wrap; max-height:190px; overflow-y:auto; }
  ::-webkit-scrollbar { width:8px; }
  ::-webkit-scrollbar-thumb { background:#d5d9e0; border-radius:4px; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <h1>KG Explorer</h1>
    <div class="sub">services.yaml + connectivity-rules.yaml, live-derived</div>

    <input type="text" id="search" placeholder="Filter nodes by name...">

    <fieldset id="retrieval-box">
      <legend>Context lens</legend>
      <input type="text" id="agent-query" placeholder="highlight what a question touches">
      <div class="knob">focus<input type="range" id="seed-k" min="1" max="10" value="3"><output id="seed-k-out">3</output></div>
      <div class="knob">hops<input type="range" id="hop-n" min="0" max="3" value="1"><output id="hop-n-out">1</output></div>
      <div class="knob">fanout<input type="range" id="fanout" min="1" max="15" value="4"><output id="fanout-out">4</output></div>
      <div class="row">
        <button id="run-retrieval" class="primary">Focus</button>
        <button id="clear-retrieval">Clear</button>
      </div>
      <div class="why" style="padding:2px 2px 6px">Visualization only. Dims the graph down to what these words touch — nothing here feeds the validator.</div>
      <div id="hits"></div>
      <div id="trace" hidden></div>
    </fieldset>

    <fieldset>
      <legend>Provider</legend>
      <label><input type="checkbox" class="f-provider" value="gcp" checked><span class="swatch" style="background:#4285F4"></span>GCP</label>
      <label><input type="checkbox" class="f-provider" value="azure" checked><span class="swatch" style="background:#8661c5"></span>Azure</label>
    </fieldset>

    <fieldset id="category-box">
      <legend>Category</legend>
    </fieldset>

    <fieldset>
      <legend>Relationship verdict</legend>
      <label><input type="checkbox" class="f-verdict" value="ALLOWED" checked><span class="swatch" style="background:#2e9e5b"></span>Allowed</label>
      <label><input type="checkbox" class="f-verdict" value="ALLOWED_WITH_NOTE"><span class="swatch" style="background:#e8a33d"></span>Allowed w/ note</label>
      <label><input type="checkbox" class="f-verdict" value="NEEDS_COMPONENT" checked><span class="swatch" style="background:#d64545"></span>Needs component</label>
    </fieldset>

    <fieldset>
      <legend>Cosmetic</legend>
      <label><input type="checkbox" id="toggle-node-labels" checked> Node labels</label>
      <label><input type="checkbox" id="toggle-edge-labels"> Relationship labels</label>
    </fieldset>

    <div class="stat" id="stats"></div>
  </div>

  <div id="canvas-wrap">
    <div id="frame"></div>
    <div id="topbar">
      <div></div>
      <div id="zoombox">
        <button id="zoom-in" title="Zoom in">+</button>
        <button id="zoom-out" title="Zoom out">&minus;</button>
        <button id="zoom-fit" title="Fit to screen">&#9737;</button>
      </div>
    </div>
  </div>

  <div id="detail"><div class="placeholder">Click a node or relationship for details.</div></div>
</div>

<script>
const PROVIDER_COLOR = { gcp: '#4285F4', azure: '#8661c5' };
const VERDICT_COLOR = { ALLOWED: '#2e9e5b', ALLOWED_WITH_NOTE: '#e8a33d', NEEDS_COMPONENT: '#d64545' };

let graphData = null;
let nvl = null;
let nodesById = new Map();
let edgesRaw = [];
let nvlNodeById = new Map();
let nvlRelById = new Map();
let presentNodeIds = new Set();
let presentEdgeIds = new Set();
let fitDone = false;
let showNodeLabels = true;
let showEdgeLabels = false;
let selectedNodeId = null;
let selectedEdgeId = null;
let nodeLabelElsById = new Map();
let edgeLabelElsById = new Map();

const VERDICT_LABEL = { ALLOWED: 'allowed', ALLOWED_WITH_NOTE: 'note', NEEDS_COMPONENT: 'needs component' };

// --- Context lens ---------------------------------------------------------
// This is a VIEWING LENS, not a retrieval step. It answers "if someone asked
// about X, which part of this graph is that?" by dimming everything else.
//
// It is deliberately a dumb substring match. An earlier version here was a
// weighted lexical scorer with a 50-entry synonym map and a query-coverage
// term — machinery built to approximate semantic search. That was the wrong
// problem: the whole KG is ~12k tokens and fits in a model's context, so a
// model reading it directly already knows Cloud SQL is a database. Nothing
// downstream reads this panel, and nothing may: feeding validate.py a subset
// of the KG would change verdicts silently, which breaks root invariant #1 by
// omission. See D22.
let retrieval = null;   // { hopById: Map<id,int>, seeds: [id], edgeIds: Set }

const MATCH_FIELDS = ['name', 'id', 'category', 'tier', 'network_placement',
                      'reachability', 'region_scope', 'roles'];

function matchNode(n, tokens) {
  const hay = MATCH_FIELDS
    .map(f => (Array.isArray(n[f]) ? n[f].join(' ') : n[f]) || '')
    .join(' ').toLowerCase().replace(/[_-]/g, ' ');
  const hits = tokens.filter(t => hay.includes(t));
  return { hits: hits.length, where: hits };
}

function runRetrieval() {
  const q = document.getElementById('agent-query').value.trim().toLowerCase();
  const k = +document.getElementById('seed-k').value;
  const hops = +document.getElementById('hop-n').value;
  if (!q) { clearRetrieval(); return; }

  const tokens = q.split(/[^a-z0-9]+/).filter(t => t.length > 1);
  // Most tokens matched wins, ties broken by name. No weighting, no ranking
  // score — a number here would imply a confidence the match does not have.
  const matched = [...nodesById.values()]
    .map(n => ({ node: n, ...matchNode(n, tokens) }))
    .filter(r => r.hits > 0)
    .sort((a, b) => b.hits - a.hits || a.node.name.localeCompare(b.node.name));

  const seeds = matched.slice(0, k).map(r => r.node.id);
  const trace = [
    `terms    : ${JSON.stringify(tokens)}`,
    `matched  : ${matched.length}/${nodesById.size} nodes`,
    `focus    : ${seeds.length ? seeds.join(', ') : '(none)'}`,
  ];

  // BFS over the *undirected* graph — an agent reading context cares that two
  // services are related, not which way the arrow points.
  //
  // This KG averages ~31 edges per node (691 over 45): almost complete. An
  // uncapped single hop returns the entire graph, which tells you nothing
  // about what a question actually pulls in. So each hop keeps only the top
  // FANOUT neighbours, ranked by how many frontier nodes they touch. Whatever
  // gets cut is reported, never silently dropped.
  const fanout = +document.getElementById('fanout').value;
  const hopById = new Map(seeds.map(id => [id, 0]));
  let frontier = seeds;
  for (let h = 1; h <= hops && frontier.length; h++) {
    const frontierSet = new Set(frontier);
    const touches = new Map();
    for (const e of edgesRaw) {
      for (const [a, b] of [[e.source, e.target], [e.target, e.source]]) {
        if (frontierSet.has(a) && !hopById.has(b)) touches.set(b, (touches.get(b) || 0) + 1);
      }
    }
    const cands = [...touches.entries()]
      .map(([id, t]) => ({ id, rank: t }))
      .sort((a, b) => b.rank - a.rank);
    const next = cands.slice(0, fanout).map(c => c.id);
    next.forEach(id => hopById.set(id, h));
    const dropped = cands.length - next.length;
    trace.push(`hop ${h}    : +${next.length} of ${cands.length} candidates` +
      (dropped ? ` (${dropped} cut by fanout=${fanout})` : '') + ` — total ${hopById.size}`);
    frontier = next;
  }

  const edgeIds = new Set();
  edgesRaw.forEach((e, i) => {
    if (hopById.has(e.source) && hopById.has(e.target)) edgeIds.add('e' + i);
  });
  trace.push(`context  : ${hopById.size} nodes, ${edgeIds.size} relationships`);

  retrieval = { hopById, seeds, edgeIds };
  renderHits(matched.slice(0, k), tokens, trace);
  applyFilters();
  if (hopById.size) setTimeout(() => nvl.fit([...presentNodeIds]), 250);
}

function renderHits(top, tokens, trace) {
  const hits = document.getElementById('hits');
  hits.innerHTML = top.length
    ? top.map(r => `<div class="hit" data-id="${r.node.id}">
         <span>${r.node.name}<div class="why">matched: ${r.where.join(', ')}</div></span>
         <span class="score">${r.hits}/${tokens.length}</span></div>`).join('')
    : '<div class="why" style="padding:4px 6px">Nothing in the KG matches those words. Confirm the service name \u2014 do not assume it exists.</div>';
  hits.querySelectorAll('.hit').forEach(el =>
    el.addEventListener('click', () => showNodeDetail(el.dataset.id)));
  const t = document.getElementById('trace');
  t.hidden = false;
  t.textContent = trace.join('\n');
}

function clearRetrieval() {
  retrieval = null;
  document.getElementById('hits').innerHTML = '';
  document.getElementById('trace').hidden = true;
  applyFilters();
}

// NVL's own canvas-based `caption` field turned out to be unreliable in this
// build — text drawing silently no-ops after certain nvl.fit()/zoom sequences
// (confirmed via isolated repro: same node, same props, works standalone,
// breaks once fit() has run). `html` / `captionHtml` are NVL's documented
// DOM-overlay escape hatches: NVL positions/scales a real DOM element over
// each node or relationship itself, so rendering can't silently drop it.
function makeNodeLabel(text) {
  const wrap = document.createElement('div');
  wrap.style.cssText = 'width:100%;height:100%;position:relative;';
  const label = document.createElement('div');
  label.className = 'node-label';
  label.textContent = text;
  wrap.appendChild(label);
  return { wrap, label };
}

function makeEdgeLabel(text) {
  const wrap = document.createElement('div');
  wrap.style.cssText = 'width:100%;height:100%;position:relative;';
  const label = document.createElement('div');
  label.className = 'edge-label';
  label.textContent = text;
  wrap.appendChild(label);
  return { wrap, label };
}

fetch('kg_graph.json')
  .then(r => r.json())
  .then(data => { graphData = data; init(data); })
  .catch(err => {
    document.getElementById('frame').innerHTML =
      '<div class="placeholder">Could not load kg_graph.json — regenerate with scripts/export_kg_graph.py and serve this directory over http (not file://).<br><br>' + err.message + '</div>';
  });

function init(data) {
  data.nodes.forEach(n => nodesById.set(n.id, n));
  edgesRaw = data.edges;

  const categories = [...new Set(data.nodes.map(n => n.category))].sort();
  const catBox = document.getElementById('category-box');
  categories.forEach(c => {
    const label = document.createElement('label');
    label.innerHTML = `<input type="checkbox" class="f-category" value="${c}" checked> ${c}`;
    catBox.appendChild(label);
  });

  data.nodes.forEach(n => {
    const { wrap, label } = makeNodeLabel(n.name);
    nodeLabelElsById.set(n.id, label);
    nvlNodeById.set(n.id, {
      id: n.id,
      color: PROVIDER_COLOR[n.provider] || '#9aa3b2',
      size: 36,
      html: wrap,
    });
  });
  data.edges.forEach((e, i) => {
    const id = 'e' + i;
    const { wrap, label } = makeEdgeLabel(VERDICT_LABEL[e.verdict] || e.verdict);
    label.style.color = VERDICT_COLOR[e.verdict] || '#9aa3b2';
    edgeLabelElsById.set(id, label);
    nvlRelById.set(id, {
      id,
      from: e.source,
      to: e.target,
      color: VERDICT_COLOR[e.verdict] || '#9aa3b2',
      width: 1.2,
      captionHtml: wrap,
    });
  });

  nvl = new window.__NVL__.NVL(
    document.getElementById('frame'),
    [],
    [],
    {
      disableTelemetry: true,
      layout: 'forceDirected',
      initialZoom: 0.7,
      renderer: 'canvas',
    },
    {
      onError: err => console.error('NVL error:', err),
      onLayoutDone: () => { if (!fitDone) { fitDone = true; nvl.fit([...presentNodeIds]); } },
    }
  );

  const { PanInteraction, ZoomInteraction, DragNodeInteraction, ClickInteraction, HoverInteraction } = window.__NVL__;
  new PanInteraction(nvl);
  new ZoomInteraction(nvl);
  new DragNodeInteraction(nvl);

  const hover = new HoverInteraction(nvl, { drawShadowOnHover: true });
  hover.updateCallback('onHover', (el, hits, evt) => {
    document.getElementById('frame').style.cursor = hits.nodes.length || hits.relationships.length ? 'pointer' : 'default';
  });

  const click = new ClickInteraction(nvl);
  click.updateCallback('onNodeClick', node => { clearSelection(); selectedNodeId = node.id; nvl.addAndUpdateElementsInGraph([{ id: node.id, selected: true }], []); showNodeDetail(node.id); });
  click.updateCallback('onRelationshipClick', rel => { clearSelection(); selectedEdgeId = rel.id; nvl.addAndUpdateElementsInGraph([], [{ id: rel.id, selected: true, width: 3 }]); showEdgeDetail(rel.id); });
  click.updateCallback('onCanvasClick', () => {
    clearSelection();
    document.getElementById('detail').innerHTML = '<div class="placeholder">Click a node or relationship for details.</div>';
  });

  document.getElementById('zoom-in').addEventListener('click', () => nvl.setZoom(nvl.getScale() * 1.3));
  document.getElementById('zoom-out').addEventListener('click', () => nvl.setZoom(nvl.getScale() / 1.3));
  document.getElementById('zoom-fit').addEventListener('click', () => nvl.fit([...presentNodeIds]));

  document.querySelectorAll('.f-provider, .f-category, .f-verdict').forEach(el =>
    el.addEventListener('change', applyFilters));
  document.getElementById('search').addEventListener('input', applyFilters);

  document.getElementById('run-retrieval').addEventListener('click', runRetrieval);
  document.getElementById('clear-retrieval').addEventListener('click', () => {
    document.getElementById('agent-query').value = '';
    clearRetrieval();
  });
  document.getElementById('agent-query').addEventListener('keydown', evt => {
    if (evt.key === 'Enter') runRetrieval();
  });
  ['seed-k', 'hop-n', 'fanout'].forEach(id => {
    const el = document.getElementById(id);
    const out = document.getElementById(id + '-out');
    el.addEventListener('input', () => {
      out.value = el.value;
      if (retrieval) runRetrieval();   // live re-run so the knobs feel like tuning a retriever
    });
  });

  document.getElementById('toggle-node-labels').addEventListener('change', evt => {
    showNodeLabels = evt.target.checked;
    nodeLabelElsById.forEach(el => { el.style.display = showNodeLabels ? '' : 'none'; });
  });
  document.getElementById('toggle-edge-labels').addEventListener('change', evt => {
    showEdgeLabels = evt.target.checked;
    edgeLabelElsById.forEach(el => { el.style.display = showEdgeLabels ? '' : 'none'; });
  });
  edgeLabelElsById.forEach(el => { el.style.display = showEdgeLabels ? '' : 'none'; });

  applyFilters();
}

function clearSelection() {
  if (selectedNodeId && presentNodeIds.has(selectedNodeId)) {
    nvl.addAndUpdateElementsInGraph([{ id: selectedNodeId, selected: false }], []);
  }
  if (selectedEdgeId && presentEdgeIds.has(selectedEdgeId)) {
    nvl.addAndUpdateElementsInGraph([], [{ id: selectedEdgeId, selected: false, width: 1.2 }]);
  }
  selectedNodeId = null;
  selectedEdgeId = null;
}

function buildNodeElement(id) {
  return nvlNodeById.get(id);
}

function buildRelElement(id) {
  return nvlRelById.get(id);
}

function activeSet(cls) {
  return new Set([...document.querySelectorAll('.f-' + cls + ':checked')].map(el => el.value));
}

function applyFilters() {
  const providers = activeSet('provider');
  const categories = activeSet('category');
  const verdicts = activeSet('verdict');
  const q = document.getElementById('search').value.trim().toLowerCase();

  const wantNodeIds = new Set();
  for (const n of nodesById.values()) {
    const match = providers.has(n.provider) && categories.has(n.category) &&
      (!q || n.name.toLowerCase().includes(q) || n.id.toLowerCase().includes(q));
    if (match) wantNodeIds.add(n.id);
  }

  // Retrieval narrows on top of the facets, never around them: what the
  // agent "sees" is the retrieved subgraph intersected with what's visible.
  if (retrieval) {
    for (const id of [...wantNodeIds]) if (!retrieval.hopById.has(id)) wantNodeIds.delete(id);
  }

  const wantEdgeIds = new Set();
  edgesRaw.forEach((e, i) => {
    if (wantNodeIds.has(e.source) && wantNodeIds.has(e.target) && verdicts.has(e.verdict)) {
      wantEdgeIds.add('e' + i);
    }
  });

  const relsToRemove = [...presentEdgeIds].filter(id => !wantEdgeIds.has(id));
  const nodesToRemove = [...presentNodeIds].filter(id => !wantNodeIds.has(id));
  if (relsToRemove.length) nvl.removeRelationshipsWithIds(relsToRemove);
  if (nodesToRemove.length) nvl.removeNodesWithIds(nodesToRemove);

  const nodesToAdd = [...wantNodeIds].filter(id => !presentNodeIds.has(id)).map(buildNodeElement);
  const relsToAdd = [...wantEdgeIds].filter(id => !presentEdgeIds.has(id)).map(buildRelElement);
  if (nodesToAdd.length || relsToAdd.length) nvl.addAndUpdateElementsInGraph(nodesToAdd, relsToAdd);

  presentNodeIds = wantNodeIds;
  presentEdgeIds = wantEdgeIds;
  applyHopStyling();

  if (selectedNodeId && !presentNodeIds.has(selectedNodeId)) selectedNodeId = null;
  if (selectedEdgeId && !presentEdgeIds.has(selectedEdgeId)) selectedEdgeId = null;

  document.getElementById('stats').textContent = retrieval
    ? `${wantNodeIds.size} / ${nodesById.size} nodes in focus · ${wantEdgeIds.size} relationships`
    : `${wantNodeIds.size} / ${nodesById.size} nodes shown`;
}

// Fades a hex colour toward the canvas background so hop distance reads as
// "further from what was asked" without needing a legend.
function fade(hex, amount) {
  const bg = [12, 14, 18];
  const c = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
  return '#' + c.map((v, i) =>
    Math.round(v + (bg[i] - v) * amount).toString(16).padStart(2, '0')).join('');
}

function applyHopStyling() {
  const updates = [];
  for (const id of presentNodeIds) {
    const base = nvlNodeById.get(id);
    const hop = retrieval ? retrieval.hopById.get(id) : 0;
    const fadeBy = retrieval ? Math.min(0.62, hop * 0.32) : 0;
    updates.push({
      id,
      color: fade(base.color, fadeBy),
      size: retrieval ? Math.max(18, 40 - hop * 9) : 36,
    });
    const label = nodeLabelElsById.get(id);
    if (label) {
      label.style.opacity = retrieval ? Math.max(0.42, 1 - hop * 0.28) : 1;
      label.style.fontWeight = retrieval && hop === 0 ? '700' : '400';
    }
  }
  if (updates.length) nvl.addAndUpdateElementsInGraph(updates, []);
}

function showNodeDetail(id) {
  const n = nodesById.get(id);
  if (!n) return;
  const rolesHtml = (n.roles || []).map(r => `<span class="badge">${r}</span>`).join('');
  document.getElementById('detail').innerHTML = `
    <h2>${n.name}</h2>
    <div class="idline">${n.id} &middot; ${n.provider}</div>
    <div class="prop"><b>category</b>${n.category}</div>
    <div class="prop"><b>tier</b>${n.tier || '—'}</div>
    <div class="prop"><b>network_placement</b>${n.network_placement || '—'}</div>
    <div class="prop"><b>reachability</b>${n.reachability || '—'}</div>
    <div class="prop"><b>region_scope</b>${n.region_scope || '—'}</div>
    <div class="prop"><b>roles</b>${rolesHtml}</div>
  `;
}

function showEdgeDetail(edgeId) {
  const i = parseInt(edgeId.slice(1), 10);
  const e = edgesRaw[i];
  if (!e) return;
  const src = nodesById.get(e.source);
  const dst = nodesById.get(e.target);
  document.getElementById('detail').innerHTML = `
    <h2>${src.name} &rarr; ${dst.name}</h2>
    <div class="idline">${e.rule_id || '—'}</div>
    <span class="verdict-pill" style="background:${VERDICT_COLOR[e.verdict]}">${e.verdict}</span>
    ${e.severity ? '<span class="prop"><b>severity</b>' + e.severity + '</span>' : ''}
    ${e.insert_component ? '<div class="prop"><b>inserts</b>' + e.insert_component.name + '</div>' : ''}
    <div class="msg">${e.message}</div>
  `;
}
</script>
</body>
</html>
