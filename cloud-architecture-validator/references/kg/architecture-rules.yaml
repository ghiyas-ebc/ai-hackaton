# Layer 2 — architecture-level checks, not pairwise connection checks.
#
# Layer 1 answers "can A connect to B". Layer 2 answers the question the client's
# architect actually asks in a design review: will this hold up, is it safe, and
# is the cost predictable. This is what separates the skill from a diagram
# generator.
#
# Each rule is implemented as a function in scripts/validate.py under the same
# id. This file controls severity, wording, and parameters — so tuning does not
# require touching code.
#
# Context the user can supply (optional; decides which rules are active):
#   environment: production | poc | dev
#   data_residency: id | eu | us | none
#   sla_tier: critical | standard | best_effort

rules:

  - id: SEC-001-PUBLIC-DATASTORE
    enabled: true
    severity: ERROR
    title: Datastore reachable over a public path
    message: >-
      A datastore is reached over a public endpoint with no private connector in
      the path. This is the first thing a client's security reviewer looks for.
    remediation: >-
      Add a private connector (Private Service Connect / Private Link / VPC
      connector), or move the compute inside the private network.

  - id: SEC-002-NO-SECRET-STORE
    enabled: true
    severity: WARNING
    title: No credential store
    message: >-
      The architecture has compute reaching a datastore but no secret store,
      which implies credentials live in environment variables or inside the
      image — a question that is almost certain to come up in review.
    remediation: Add Secret Manager / Key Vault to the architecture.

  - id: SEC-003-COMPUTE-EXPOSED
    enabled: true
    severity: WARNING
    title: Compute exposed with no managed entry point
    message: >-
      Compute receives external traffic with no load balancer or gateway in
      front, so there is nowhere to attach a WAF, rate limiting, or centralized
      TLS termination.
    remediation: Put an L7 load balancer or gateway at the entry point.

  - id: REL-001-SINGLE-ZONE
    enabled: true
    severity: WARNING
    applies_when:
      environment: [production]
    title: Zonal component with no redundancy
    message: >-
      A component is scoped to a single zone. If that zone has trouble, the whole
      service goes with it.
    remediation: >-
      Use a managed instance group / availability set across zones, or switch to
      a regional service.

  - id: REL-002-SINGLE-REGION
    enabled: true
    severity: INFO
    applies_when:
      environment: [production]
      sla_tier: [critical]
    title: Entire architecture in one region
    message: >-
      There is no region-level resilience. State this explicitly in the proposal
      — far better presented as a deliberate decision than discovered by the
      client as an oversight.
    remediation: Agree RTO/RPO with the client before committing to an SLA.

  - id: REL-003-NO-DATA-DURABILITY
    enabled: true
    severity: INFO
    title: No backup shown
    message: >-
      The diagram shows no backup or replica for the datastores. Managed services
      usually have automated backups, but a technical audience will ask if it
      isn't visible.
    remediation: Annotate the backup policy on the datastore nodes.

  - id: COST-001-CROSS-REGION-TRAFFIC
    enabled: true
    severity: INFO
    title: Possible cross-region traffic
    message: >-
      The architecture mixes regional and multi-region components. Traffic
      leaving a region is billable and adds latency — frequently missed in
      proposal-stage cost estimates.
    remediation: Align the regions, or include egress in the cost estimate.

  - id: GOV-001-DATA-RESIDENCY
    enabled: true
    severity: WARNING
    applies_when:
      data_residency: [id, eu]
    title: Multi-region datastore under a data residency obligation
    message: >-
      A datastore is multi-region while the client has a data residency
      obligation. For regulated sectors in Indonesia (financial services, or
      data subject to PP 71/2019), this can invalidate the whole design at
      compliance review.
    remediation: >-
      Configure a compliant single-region location, and verify that region is
      available before committing to the client.

  - id: OPS-001-NO-OBSERVABILITY
    enabled: true
    severity: INFO
    title: No observability component
    message: >-
      No logging or monitoring is shown. Reasonable for a PoC, but usually asked
      about in a production proposal.
    remediation: Add a monitoring note, or state that it is out of PoC scope.

  - id: VIZ-001-TOO-MANY-NODES
    enabled: true
    severity: INFO
    threshold: 20
    title: Diagram too dense
    message: >-
      The node count exceeds the readability threshold for a non-technical
      audience. One unreadable diagram is worse than three clear ones.
    remediation: Split by subsystem or domain.
