# Three things that cannot be derived from node properties.
#
# Keep this file small. If it starts growing quickly, that is a signal that
# connectivity-rules.yaml is missing a general rule — fix the rule rather than
# adding an override. Accumulating overrides drags this skill back to the
# pair-list model it was built to leave behind.

# ---------------------------------------------------------------- ALIASES ---
# Names that circulate in conversation but are not standalone nodes.
# The original draft modelled `azure-waf` as its own service, which made the
# diagram render a dangling WAF box — WAF is a SKU/policy on Application
# Gateway or Front Door.
aliases:
  - alias: azure-waf
    resolves_to: azure-app-gateway
    as: feature
    feature: waf
    note: >-
      On Azure, WAF is a policy on Application Gateway or Front Door. Draw it as
      a badge on that node, not as a separate box.
  - alias: azure-database-mysql
    resolves_to: azure-sql-database
    as: engine_variant
    note: >-
      If the user needs a MySQL/PostgreSQL engine on Azure, the product is Azure
      Database for MySQL/PostgreSQL — not Azure SQL Database. Say so explicitly
      before continuing.

# -------------------------------------------------------------- OVERRIDES ---
# Specific pairs whose outcome differs from the general rules.
# A `reason` is mandatory — why the general rule does not apply here.
overrides: []

# ----------------------------------------------------------- ALTERNATIVES ---
# Pairs that are mutually exclusive — pick one, do not use both.
# This is DELIBERATELY separate from connectivity. In the original draft,
# ALTERNATIVE_TO lived in the `connections` table with is_valid=TRUE, so an
# arrow from Cloud SQL to Spanner would be reported as a valid connection.
alternatives:
  - pair: [cloud-sql, spanner]
    decision: >-
      Cloud SQL for regional scale; Spanner for global needs with strong
      cross-region consistency. Deciding question: does the data have to be
      strongly consistent across more than one region?
  - pair: [firestore, bigtable]
    decision: >-
      Firestore for document workloads and mobile/web apps; Bigtable for very
      high throughput and time-series data. Deciding question: what is the read
      pattern — per-document lookups or large range scans?
  - pair: [cloud-run, gke-autopilot]
    decision: >-
      Cloud Run for stateless containers with no orchestration needs; GKE for
      multi-service workloads needing scheduling control. Deciding question:
      does the team have the capacity to operate Kubernetes?
  - pair: [azure-sql-database, azure-cosmos-db]
    decision: >-
      SQL Database for structured relational data; Cosmos DB for multi-model
      NoSQL with global distribution. Deciding question: is the schema
      relational and does it need joins?
  - pair: [azure-load-balancer, azure-app-gateway]
    decision: >-
      Load Balancer for L4 (TCP/UDP); Application Gateway for L7 with path/host
      routing and WAF. Azure splits these into separate products where GCP
      merges them into Cloud Load Balancing. Deciding question: is HTTP
      termination and routing needed, or not?
  - pair: [azure-service-bus, azure-event-grid]
    decision: >-
      Service Bus for queues with delivery and ordering guarantees; Event Grid
      for lightweight event distribution. Deciding question: can losing a single
      message be tolerated?
