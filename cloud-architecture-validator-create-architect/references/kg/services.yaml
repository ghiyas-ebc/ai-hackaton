# Node table — one entry per service, across all providers.
#
# Connection validity is NOT stored here and is not stored as a list of pairs.
# It is derived from the properties below by connectivity-rules.yaml. Adding a
# service means adding one entry, not adding N pairs.
#
# Properties that drive validation:
#
# network_placement — where this workload/service lives relative to the customer VPC
#   serverless_offvpc : runs outside the customer VPC by default
#   in_vpc            : the instance/node sits inside the customer VPC
#   managed_service   : a managed service reached via an endpoint (not a "place")
#   network_fabric    : the private network itself
#   connector         : a component bridging two network contexts
#   edge              : the entry point for traffic from the internet
#   policy            : not a traffic node; attaches to another node
#
# reachability — how this service is reached AS A TARGET
#   api_endpoint      : global API endpoint, IAM-authorized, needs no special network path
#   private_ip        : only from inside a private network
#   public_or_private : both options exist; the public path works but is not the safe default
#   n_a               : not reached as a traffic target
#
# roles — functional capabilities; used by rules and by cross-provider translation.
#   The same role can be held by services from different providers — that is what
#   lets intermediaries translate correctly along with everything else.

services:

  # ---------------------------------------------------------------- GCP ----
  - id: cloud-run
    name: Cloud Run
    provider: gcp
    category: compute
    tier: serverless
    roles: [compute, container_runtime, http_target]
    network_placement: serverless_offvpc
    reachability: api_endpoint
    region_scope: regional

  - id: cloud-functions
    name: Cloud Functions
    provider: gcp
    category: compute
    tier: serverless
    roles: [compute, function_runtime, http_target, event_consumer]
    network_placement: serverless_offvpc
    reachability: api_endpoint
    region_scope: regional

  - id: gke-autopilot
    name: GKE Autopilot
    provider: gcp
    category: compute
    tier: managed
    roles: [compute, kubernetes, container_runtime, http_target]
    network_placement: in_vpc
    reachability: private_ip
    region_scope: regional

  - id: compute-engine
    name: Compute Engine
    provider: gcp
    category: compute
    tier: self_managed
    roles: [compute, vm, http_target]
    network_placement: in_vpc
    reachability: private_ip
    region_scope: zonal

  - id: app-engine
    name: App Engine
    provider: gcp
    category: compute
    tier: managed
    roles: [compute, paas_app_host, http_target]
    network_placement: serverless_offvpc
